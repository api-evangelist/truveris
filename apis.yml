name: Truveris
description: >-
  Truveris is an independent pharmacy benefits consulting and analytics firm,
  founded in 2009 and headquartered in New York, that helps employers, benefits
  consultants, and brokers optimize their pharmacy programs and reduce drug
  spend. The company turns complex pharmacy claims and contract data into clear,
  actionable insight through products including the Truveris Marketplace for PBM
  plan procurement, truGuard for ongoing contract and pricing oversight,
  pharmacy audits, and PBM contract analytics. Truveris serves hundreds of
  clients with data-driven cost containment strategies. As of this enrichment
  pass the company exposes no public developer portal, API documentation, or
  machine-readable API surface; this profile captures its identity and public
  web properties. Backed by Canaan Partners.
